apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-web-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-web
  template:
    metadata:
      labels:
        app: analytics-web
    spec:
      containers:
      - name: website-container
        image: pratikbadshah03/analytics-website:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-web-svc
spec:
  type: NodePort
  selector:
    app: analytics-web
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30008
